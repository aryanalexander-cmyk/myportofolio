<div id="edit-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Close edit experience form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Close edit experience form">×</button>

        <h2 id="edit-experience-modal-title">Edit Experience</h2>
        <form id="edit-experience-form" class="project-form">
            {% csrf_token %}
            <input type="hidden" id="edit-experience-id" name="id">
            <div class="form-group">
                <label for="edit-experience-title">Experience Title</label>
                <input type="text"
                       id="edit-experience-title"
                       name="title"
                       required
                       maxlength="255"
                       class="skill-search__input"
                       style="width: 100%;">
            </div>
            <div class="form-group">
                <label for="edit-experience-category">Category</label>
                <select id="edit-experience-category" name="category" class="skill-search__input" style="width: 100%;">
                    <option value="internship">Internship</option>
                    <option value="research">Research</option>
                    <option value="volunteer">Volunteer</option>
                    <option value="part-time">Part-Time</option>
                    <option value="full-time">Full-Time</option>
                    <option value="freelance">Freelance</option>
                </select>
            </div>
            <div class="form-group">
                <label for="edit-experience-description">Description</label>
                <textarea id="edit-experience-description"
                          name="description"
                          rows="3"
                          class="skill-search__input"
                          style="width: 100%;"></textarea>
            </div>
            <div class="form-group">
                <label for="edit-experience-thumbnail">Thumbnail URL</label>
                <input type="url"
                       id="edit-experience-thumbnail"
                       name="thumbnail"
                       class="skill-search__input"
                       style="width: 100%;">
            </div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>
