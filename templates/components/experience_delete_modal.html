<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-exp-{{ experience.id }}"
            aria-label="Delete {{ experience.title }}"
            title="Delete experience">
        Delete Experience
    </button>
</p>
<div id="delete-exp-{{ experience.id }}"
     class="skills-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-exp-title-{{ experience.id }}">
    <button type="button"
            class="skills-delete-modal__backdrop"
            popovertarget="delete-exp-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close deletion confirmation"></button>
    <div class="skills-delete-modal__content">
        <button type="button"
                class="skills-delete-modal__close"
                popovertarget="delete-exp-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Close deletion confirmation">×</button>
        <h2 id="delete-exp-title-{{ experience.id }}">Delete experience?</h2>
        <p>
            Are you certain in erasing
            <strong>{{ experience.title }}</strong>?
        </p>
        <div class="skills-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-exp-{{ experience.id }}"
                    popovertargetaction="hide">Quit</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Proceed with erasure</button>
            </form>
        </div>
    </div>
</div>
