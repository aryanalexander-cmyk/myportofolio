<div id="edit-atelier-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-atelier-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-atelier-modal"
            popovertargetaction="hide"
            aria-label="Close edit project form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-atelier-modal"
                popovertargetaction="hide"
                aria-label="Close edit project form">×</button>

        <h2 id="edit-atelier-modal-title">Edit Project</h2>
        <form id="edit-atelier-form" class="project-form">
            {% csrf_token %}
            <input type="hidden" id="edit-atelier-id" name="id">
            <div class="form-group">
                <label for="edit-atelier-title">Project Title</label>
                <input type="text"
                       id="edit-atelier-title"
                       name="title"
                       required
                       maxlength="255"
                       class="skill-search__input"
                       style="width: 100%;">
            </div>
            <div class="form-group">
                <label for="edit-atelier-url">Project Link</label>
                <input type="url"
                       id="edit-atelier-url"
                       name="project_url"
                       required
                       class="skill-search__input"
                       style="width: 100%;">
            </div>
            <div class="form-group">
                <label for="edit-atelier-image">Thumbnail Image URL</label>
                <input type="url"
                       id="edit-atelier-image"
                       name="image_url"
                       required
                       class="skill-search__input"
                       style="width: 100%;">
            </div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-atelier-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>
